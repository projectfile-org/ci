org:
  projectfile:
    artifacts:
      go-binary:
        command: pf-ci
        kind: binary
        path: dist/pf-ci
    architecture:
      - amd64
      - arm64
      - riscv64
    operating-system:
      - linux
    ci:
      features-level: 1
      nodes:
        binaries-are-built:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
        gsa:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
        binaries-are-released:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
      status: maintained
    readme:
      usage:
        - commands:
            - pf-ci resolve
            - pf-ci generate -target forgejo
            - pf-ci generate -target gha -check
          name: binary
          prefix: 'Lower the CI DAG to a forge’s workflow files:'
