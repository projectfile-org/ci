---
name: dev-projectfile-ci
services:
  projectfile-ci:
    container_name: ${M6E_CONTAINER_INSTANCE}
    image: ${M6E_IMAGE_FULLNAME}
    labels:
      com.docker.compose.watch: 'true'
    networks:
      - dev-projectfile-network
    environment:
      - LANG
      - TZ
      - B19_VERBOSITY=debug
    tmpfs:
      - /tmp:size=64m
    volumes:
      - /etc/localtime:/etc/localtime:ro
networks:
  dev-projectfile-network:
    name: dev-projectfile-network
    external: true
