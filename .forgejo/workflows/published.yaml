#
# Generated by pf-ci from org.projectfile.ci — DO NOT EDIT.
# Regenerate with: pf-ci generate --target forgejo
# A freshness gate (pf-ci generate --check) runs in CI so this file cannot
# silently drift from the source DAG.
---
name: published
"on":
  push: {}
  pull_request: {}
  workflow_dispatch:
    inputs:
      B19_COLOR:
        type: string
        default: "1"
      B19_FETCH_DOCKER_CACHE:
        type: string
        default: "Y"
      B19_FETCH_LOCAL_CACHE:
        type: string
        default: "Y"
      B19_OFFGRID_MODE:
        type: string
        default: "N"
      B19_UBUNTU_SERIES:
        type: string
        default: "resolute"
      B19_VERBOSITY:
        type: string
        default: "info"
      DESTINATION_DOCKER_REGISTRY:
        type: string
      GOPROXY:
        type: string
      LANG:
        type: string
      M6E_APT_CACHE_HOST:
        type: string
      M6E_APT_CACHE_PORT:
        type: string
      M6E_BUILD_DEBUG:
        type: string
      M6E_NEAR_CACHE_HOST:
        type: string
      M6E_NEAR_CACHE_PORT:
        type: string
      SOURCE_DOCKER_REGISTRY:
        type: string
env:
  M6E_TAG: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
  M6E_RUN_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
  GOPROXY: https://kiota.ch/api/packages/projectfile/go,direct
jobs:
  artifacts-are-ok:
    runs-on: docker
    needs: ["binaries-are-ok", "image-is-ready", "inputs-are-ok"]
    steps:
      - run: echo artifacts-are-ok
  binaries-are-built:
    runs-on: docker
    needs: ["inputs-are-ok"]
    strategy:
      matrix:
        GOARCH: ["amd64", "arm64", "riscv64"]
        GOOS: ["linux", "darwin"]
        exclude:
          - GOARCH: "riscv64"
            GOOS: "darwin"
    env:
      GOARCH: ${{ matrix.GOARCH }}
      GOOS: ${{ matrix.GOOS }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: build-binaries
        if: (vars.CI_ONLY_GOARCH == '' || contains(format(',{0},', vars.CI_ONLY_GOARCH), format(',{0},', matrix.GOARCH))) && (vars.CI_ONLY_GOOS == '' || contains(format(',{0},', vars.CI_ONLY_GOOS), format(',{0},', matrix.GOOS))) && vars.CI_SKIP_BINARIES_ARE_BUILT != 'true' && vars.CI_SKIP_BUILD_BINARIES != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.GO_TOOL_IMAGE || format('{0}/b19/go', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: .scripts/build-binaries.sh
          env: |-
            GOARCH=${{ matrix.GOARCH }}
            GOOS=${{ matrix.GOOS }}
            GITHUB_REF_NAME
            GOPROXY
          mounts: /app/data/ci-cache/go:/app/.cache/go:rw
      - uses: actions/upload-artifact@v3
        if: (vars.CI_ONLY_GOARCH == '' || contains(format(',{0},', vars.CI_ONLY_GOARCH), format(',{0},', matrix.GOARCH))) && (vars.CI_ONLY_GOOS == '' || contains(format(',{0},', vars.CI_ONLY_GOOS), format(',{0},', matrix.GOOS))) && vars.CI_SKIP_BINARIES_ARE_BUILT != 'true' && vars.CI_SKIP_BUILD_BINARIES != 'true'
        with:
          name: build-binaries-${{ matrix.GOARCH }}-${{ matrix.GOOS }}-${{ github.run_id }}
          path: dist
  binaries-are-ok:
    runs-on: docker
    needs: ["binaries-are-built", "gsa"]
    steps:
      - run: echo binaries-are-ok
  binaries-are-released:
    runs-on: docker
    needs: ["binaries-are-ok"]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        GOARCH: ["amd64", "arm64", "riscv64"]
        GOOS: ["linux", "darwin"]
        exclude:
          - GOARCH: "riscv64"
            GOOS: "darwin"
    env:
      GOARCH: ${{ matrix.GOARCH }}
      GOOS: ${{ matrix.GOOS }}
      FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@v3
        if: (vars.CI_ONLY_GOARCH == '' || contains(format(',{0},', vars.CI_ONLY_GOARCH), format(',{0},', matrix.GOARCH))) && (vars.CI_ONLY_GOOS == '' || contains(format(',{0},', vars.CI_ONLY_GOOS), format(',{0},', matrix.GOOS)))
        with:
          name: build-binaries-${{ matrix.GOARCH }}-${{ matrix.GOOS }}-${{ github.run_id }}
          path: dist
      - name: forgejo-release
        if: (vars.CI_ONLY_GOARCH == '' || contains(format(',{0},', vars.CI_ONLY_GOARCH), format(',{0},', matrix.GOARCH))) && (vars.CI_ONLY_GOOS == '' || contains(format(',{0},', vars.CI_ONLY_GOOS), format(',{0},', matrix.GOOS))) && vars.CI_SKIP_BINARIES_ARE_RELEASED != 'true' && vars.CI_SKIP_FORGEJO_RELEASE != 'true'
        uses: projectfile/actions/forgejo-release@v1
        with:
          version: ${{ github.ref_name }}
          # The unsuffixed binary path resolved from org.projectfile.artifacts (the single
          # kind=binary entry). The action suffixes it per cell (→ <path>-${GOOS}-${GOARCH})
          # to find the binary the build→consumer download edge restored to the workspace.
          release-asset-path: dist/pf-ci
  container-is-ok:
    runs-on: docker
    needs: ["images-are-ok"]
    steps:
      - run: echo container-is-ok
  container-is-verified:
    runs-on: docker
    needs: ["container-ready-to-test"]
    env:
      M6E_IMAGE_FULLNAME: projectfile/ci:${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}-${{ github.run_id }}
      M6E_COMPOSE_PROJECT_NAME: ci-projectfile-ci-${{ github.run_id }}-${{ github.run_attempt }}
      M6E_CONTAINER_INSTANCE: ci-projectfile-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@v3
        with:
          name: image-${{ github.run_id }}
      # The archive enters the runner's SHARED image store, where a sibling job's reap
      # can delete a layer record mid-copy — podman then buries the real cause under a
      # four-transport probe that claims the tar matches no supported format. The retry
      # for that class lives in the pinned action, not inline (Law 2).
      - uses: projectfile/actions/container-load@v1
        with:
          archive: image-${{ github.run_id }}.tar
      - name: dc-pull
        if: vars.CI_SKIP_IMAGES_ARE_OK != 'true' && vars.CI_SKIP_DC_PULL != 'true'
        run: M6E_COMPOSE_FILE=.compose/pipeline.yaml .makefile/container/scripts/compose-pull.sh
      - name: dc-up-d
        if: vars.CI_SKIP_CONTAINER_IS_OK != 'true' && vars.CI_SKIP_DC_UP_D != 'true'
        run: timeout --kill-after=10s "${M6E_COMPOSE_UP_TIMEOUT:-300}s" docker compose --project-name "$M6E_COMPOSE_PROJECT_NAME" --file .compose/pipeline.yaml up --detach --renew-anon-volumes --no-build </dev/null
      - name: container-test
        if: vars.CI_SKIP_CONTAINER_READY_TO_TEST != 'true' && vars.CI_SKIP_CONTAINER_TEST != 'true'
        uses: projectfile/actions/container-exec@v1
        with:
          container: ${{ env.M6E_CONTAINER_INSTANCE }}
          run: test.d
      - name: dc-down
        if: ${{ always() }}
        run: docker compose --project-name "$M6E_COMPOSE_PROJECT_NAME" --file .compose/pipeline.yaml down --volumes </dev/null
      # Reap the run-scoped image tag AND the live stack's network. Both are unique per
      # run (the tag carries M6E_RUN_SCOPE, the network the run-scoped project name), so
      # without this the runner's docker store gains one image per run forever AND a
      # failed/timed-out `up` can orphan the network (compose reports the removal error
      # WITHOUT failing). RmiImage and RmNetwork are always PAIRED (single assignment
      # site), so one docker-cleanup step reaps both — the imperative reaps + their
      # `inspect` guard live in the pinned action, not inline (Law 2).
      - if: ${{ always() }}
        uses: projectfile/actions/docker-cleanup@v1
        with:
          image: projectfile/ci:${{ env.M6E_TAG }}-${{ github.run_id }}
          network: ci-projectfile-ci-${{ env.M6E_RUN_SCOPE }}-network
  container-ready-to-test:
    runs-on: docker
    needs: ["container-is-ok"]
    steps:
      - run: echo container-ready-to-test
  documentation-is-ok:
    runs-on: docker
    needs: ["documentation-passes-lint"]
    steps:
      - run: echo documentation-is-ok
  documentation-passes-lint:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: auto-markdownlint
        if: vars.CI_SKIP_DOCUMENTATION_PASSES_LINT != 'true' && vars.CI_SKIP_AUTO_MARKDOWNLINT != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_JS_TOOLS_IMAGE || format('{0}/d9t/js-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-markdownlint
      - name: auto-textlint
        if: vars.CI_SKIP_DOCUMENTATION_PASSES_LINT != 'true' && vars.CI_SKIP_AUTO_TEXTLINT != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_JS_TOOLS_IMAGE || format('{0}/d9t/js-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-textlint
  fetched:
    runs-on: docker
    steps:
      - run: echo fetched
  gsa:
    runs-on: docker
    needs: ["binaries-are-built"]
    strategy:
      matrix:
        GOARCH: ["amd64", "arm64", "riscv64"]
        GOOS: ["linux", "darwin"]
        exclude:
          - GOARCH: "riscv64"
            GOOS: "darwin"
    env:
      GOARCH: ${{ matrix.GOARCH }}
      GOOS: ${{ matrix.GOOS }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@v3
        if: (vars.CI_ONLY_GOARCH == '' || contains(format(',{0},', vars.CI_ONLY_GOARCH), format(',{0},', matrix.GOARCH))) && (vars.CI_ONLY_GOOS == '' || contains(format(',{0},', vars.CI_ONLY_GOOS), format(',{0},', matrix.GOOS)))
        with:
          name: build-binaries-${{ matrix.GOARCH }}-${{ matrix.GOOS }}-${{ github.run_id }}
          path: dist
      - name: auto-gsa
        if: (vars.CI_ONLY_GOARCH == '' || contains(format(',{0},', vars.CI_ONLY_GOARCH), format(',{0},', matrix.GOARCH))) && (vars.CI_ONLY_GOOS == '' || contains(format(',{0},', vars.CI_ONLY_GOOS), format(',{0},', matrix.GOOS))) && vars.CI_SKIP_GSA != 'true' && vars.CI_SKIP_AUTO_GSA != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: .makefile/library/scripts/gsa-cell.sh dist/pf-ci
          env: |-
            GOARCH=${{ matrix.GOARCH }}
            GOOS=${{ matrix.GOOS }}
  image-is-built:
    runs-on: docker
    needs: ["fetched", "inputs-are-ok"]
    concurrency:
      group: build-${{ github.repository }}-${{ toJSON(matrix) }}
      cancel-in-progress: false
    env:
      M6E_NAMESPACE: projectfile
      M6E_PROJECT: ci
      B19_COLOR: ${{ inputs.B19_COLOR || vars.B19_COLOR || '1' }}
      B19_FETCH_DOCKER_CACHE: ${{ inputs.B19_FETCH_DOCKER_CACHE || vars.B19_FETCH_DOCKER_CACHE || 'Y' }}
      B19_FETCH_LOCAL_CACHE: ${{ inputs.B19_FETCH_LOCAL_CACHE || vars.B19_FETCH_LOCAL_CACHE || 'Y' }}
      B19_GO_BASE_IMAGE: ${{ vars.B19_GO_BASE_IMAGE || format('{0}/b19/go:{1}', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch', vars.BASE_IMAGE_DEFAULT_VERSION || 'latest') }}
      B19_OFFGRID_MODE: ${{ inputs.B19_OFFGRID_MODE || vars.B19_OFFGRID_MODE || 'N' }}
      B19_UBUNTU_BASE_IMAGE: ${{ vars.B19_UBUNTU_BASE_IMAGE || format('{0}/b19/ubuntu/{1}:{2}', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch', vars.B19_UBUNTU_SERIES || 'resolute', vars.BASE_IMAGE_DEFAULT_VERSION || 'latest') }}
      B19_UBUNTU_SERIES: ${{ inputs.B19_UBUNTU_SERIES || vars.B19_UBUNTU_SERIES || 'resolute' }}
      B19_VERBOSITY: ${{ inputs.B19_VERBOSITY || vars.B19_VERBOSITY || 'info' }}
      DESTINATION_DOCKER_REGISTRY: ${{ inputs.DESTINATION_DOCKER_REGISTRY || vars.DESTINATION_DOCKER_REGISTRY }}
      GOPROXY: ${{ inputs.GOPROXY || vars.GOPROXY }}
      LANG: ${{ inputs.LANG || vars.LANG }}
      M6E_APT_CACHE_HOST: ${{ inputs.M6E_APT_CACHE_HOST || vars.M6E_APT_CACHE_HOST }}
      M6E_APT_CACHE_PORT: ${{ inputs.M6E_APT_CACHE_PORT || vars.M6E_APT_CACHE_PORT }}
      M6E_BUILD_DEBUG: ${{ inputs.M6E_BUILD_DEBUG || vars.M6E_BUILD_DEBUG }}
      M6E_NEAR_CACHE_HOST: ${{ inputs.M6E_NEAR_CACHE_HOST || vars.M6E_NEAR_CACHE_HOST }}
      M6E_NEAR_CACHE_PORT: ${{ inputs.M6E_NEAR_CACHE_PORT || vars.M6E_NEAR_CACHE_PORT }}
      SOURCE_DOCKER_REGISTRY: ${{ inputs.SOURCE_DOCKER_REGISTRY || vars.SOURCE_DOCKER_REGISTRY }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: container-build
        if: vars.CI_SKIP_IMAGE_IS_BUILT != 'true' && vars.CI_SKIP_CONTAINER_BUILD != 'true'
        uses: projectfile/actions/container-build/buildah@v1
        with:
          artifact-name: image-${{ github.run_id }}
          image: projectfile/ci:${{ env.M6E_TAG }}-${{ github.run_id }}
          build-args: |-
            B19_COLOR=${{ inputs.B19_COLOR || vars.B19_COLOR || '1' }}
            B19_FETCH_DOCKER_CACHE=${{ inputs.B19_FETCH_DOCKER_CACHE || vars.B19_FETCH_DOCKER_CACHE || 'Y' }}
            B19_FETCH_LOCAL_CACHE=${{ inputs.B19_FETCH_LOCAL_CACHE || vars.B19_FETCH_LOCAL_CACHE || 'Y' }}
            B19_GO_BASE_IMAGE=${{ vars.B19_GO_BASE_IMAGE || format('{0}/b19/go:{1}', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch', env.M6E_TAG) }}
            B19_OFFGRID_MODE=${{ inputs.B19_OFFGRID_MODE || vars.B19_OFFGRID_MODE || 'N' }}
            B19_UBUNTU_BASE_IMAGE=${{ vars.B19_UBUNTU_BASE_IMAGE || format('{0}/b19/ubuntu/{1}:{2}', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch', vars.B19_UBUNTU_SERIES || 'resolute', env.M6E_TAG) }}
            B19_UBUNTU_SERIES=${{ inputs.B19_UBUNTU_SERIES || vars.B19_UBUNTU_SERIES || 'resolute' }}
            B19_VERBOSITY=${{ inputs.B19_VERBOSITY || vars.B19_VERBOSITY || 'info' }}
            DESTINATION_DOCKER_REGISTRY=${{ inputs.DESTINATION_DOCKER_REGISTRY || vars.DESTINATION_DOCKER_REGISTRY }}
            GOPROXY=${{ inputs.GOPROXY || vars.GOPROXY }}
            LANG=${{ inputs.LANG || vars.LANG }}
            M6E_APT_CACHE_HOST=${{ inputs.M6E_APT_CACHE_HOST || vars.M6E_APT_CACHE_HOST }}
            M6E_APT_CACHE_PORT=${{ inputs.M6E_APT_CACHE_PORT || vars.M6E_APT_CACHE_PORT }}
            M6E_BUILD_DEBUG=${{ inputs.M6E_BUILD_DEBUG || vars.M6E_BUILD_DEBUG }}
            M6E_NAMESPACE=projectfile
            M6E_NEAR_CACHE_HOST=${{ inputs.M6E_NEAR_CACHE_HOST || vars.M6E_NEAR_CACHE_HOST }}
            M6E_NEAR_CACHE_PORT=${{ inputs.M6E_NEAR_CACHE_PORT || vars.M6E_NEAR_CACHE_PORT }}
            M6E_PROJECT=ci
            SOURCE_DOCKER_REGISTRY=${{ inputs.SOURCE_DOCKER_REGISTRY || vars.SOURCE_DOCKER_REGISTRY }}
          mounts: fetch=/fetch
          pf-cli-image: ${{ vars.PF_CLI_IMAGE || format('{0}/projectfile/cli:{1}', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch', env.M6E_TAG) }}
  image-is-ready:
    runs-on: docker
    needs: ["container-is-verified", "image-is-secure"]
    steps:
      - run: echo image-is-ready
  image-is-secure:
    runs-on: docker
    needs: ["image-is-built"]
    env:
      M6E_IMAGE_ARCHIVE: image-${{ github.run_id }}.tar
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@v3
        with:
          name: image-${{ github.run_id }}
      - name: grype-scan-tar
        if: vars.CI_SKIP_IMAGE_IS_SECURE != 'true' && vars.CI_SKIP_GRYPE_SCAN_TAR != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-grype image
          env: |-
            M6E_IMAGE_ARCHIVE=image-${{ github.run_id }}.tar
            M6E_SHARED_CACHE=Y
          mounts: /app/data/ci-cache/grype-db:/app/.cache/grype:rw
      - name: trivy-scan-tar
        if: vars.CI_SKIP_IMAGE_IS_SECURE != 'true' && vars.CI_SKIP_TRIVY_SCAN_TAR != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-trivy image
          env: |-
            M6E_IMAGE_ARCHIVE=image-${{ github.run_id }}.tar
            M6E_SHARED_CACHE=Y
            TRIVY_CACHE_BACKEND
          mounts: /app/data/ci-cache/trivy-db:/app/.cache/trivy:rw
      - uses: actions/upload-artifact@v3
        if: ${{ always() }}
        with:
          name: reports-image-is-secure-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
  images-are-ok:
    runs-on: docker
    needs: ["image-is-built", "secrets-ready"]
    steps:
      - run: echo images-are-ok
  inputs-are-ok:
    runs-on: docker
    needs: ["documentation-is-ok", "projectfile-is-ok", "source-is-ok"]
    steps:
      - run: echo inputs-are-ok
  projectfile-is-ok:
    runs-on: docker
    needs: ["projectfile-is-valid"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: pf-bridge-check
        if: vars.CI_SKIP_PROJECTFILE_IS_OK != 'true' && vars.CI_SKIP_PF_BRIDGE_CHECK != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.PF_BRIDGE_IMAGE || format('{0}/projectfile/bridge', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: pf-bridge check
  projectfile-is-valid:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: pf-validate
        if: vars.CI_SKIP_PROJECTFILE_IS_VALID != 'true' && vars.CI_SKIP_PF_VALIDATE != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.PF_CLI_IMAGE || format('{0}/projectfile/cli', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: pf-cli validate
  publish-image:
    runs-on: docker
    needs: ["image-is-built", "ready-to-publish"]
    if: (startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (startsWith(github.ref, 'refs/tags/'))
    concurrency:
      group: publish-${{ github.repository }}-${{ toJSON(matrix) }}
      cancel-in-progress: false
    strategy:
      matrix:
        M6E_PUBLISH_SINK: ["kiota"]
    env:
      DOCKERHUB_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_REGISTRY_PASSWORD }}
      DOCKERHUB_REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@v3
        if: (vars.CI_ONLY_M6E_PUBLISH_SINK == '' || contains(format(',{0},', vars.CI_ONLY_M6E_PUBLISH_SINK), format(',{0},', matrix.M6E_PUBLISH_SINK)))
        with:
          name: build-binaries-amd64-linux-${{ github.run_id }}
          path: dist
      - uses: actions/download-artifact@v3
        if: (vars.CI_ONLY_M6E_PUBLISH_SINK == '' || contains(format(',{0},', vars.CI_ONLY_M6E_PUBLISH_SINK), format(',{0},', matrix.M6E_PUBLISH_SINK)))
        with:
          name: build-binaries-amd64-darwin-${{ github.run_id }}
          path: dist
      - uses: actions/download-artifact@v3
        if: (vars.CI_ONLY_M6E_PUBLISH_SINK == '' || contains(format(',{0},', vars.CI_ONLY_M6E_PUBLISH_SINK), format(',{0},', matrix.M6E_PUBLISH_SINK)))
        with:
          name: build-binaries-arm64-linux-${{ github.run_id }}
          path: dist
      - uses: actions/download-artifact@v3
        if: (vars.CI_ONLY_M6E_PUBLISH_SINK == '' || contains(format(',{0},', vars.CI_ONLY_M6E_PUBLISH_SINK), format(',{0},', matrix.M6E_PUBLISH_SINK)))
        with:
          name: build-binaries-arm64-darwin-${{ github.run_id }}
          path: dist
      - uses: actions/download-artifact@v3
        if: (vars.CI_ONLY_M6E_PUBLISH_SINK == '' || contains(format(',{0},', vars.CI_ONLY_M6E_PUBLISH_SINK), format(',{0},', matrix.M6E_PUBLISH_SINK)))
        with:
          name: build-binaries-riscv64-linux-${{ github.run_id }}
          path: dist
      - uses: actions/download-artifact@v3
        if: (vars.CI_ONLY_M6E_PUBLISH_SINK == '' || contains(format(',{0},', vars.CI_ONLY_M6E_PUBLISH_SINK), format(',{0},', matrix.M6E_PUBLISH_SINK)))
        with:
          name: image-${{ github.run_id }}
      - name: oci-push
        # The cell's run-time override gate, on the STEP because a job `if:` may not read the matrix context
        if: (vars.CI_ONLY_M6E_PUBLISH_SINK == '' || contains(format(',{0},', vars.CI_ONLY_M6E_PUBLISH_SINK), format(',{0},', matrix.M6E_PUBLISH_SINK))) && vars.CI_SKIP_PUBLISH_IMAGE != 'true' && vars.CI_SKIP_OCI_PUSH != 'true'
        uses: projectfile/actions/oci-push@v1
        with:
          artifact-name: image-${{ github.run_id }}
          image: projectfile/ci:${{ env.M6E_TAG }}-${{ github.run_id }}
          version: ${{ github.ref_name }}
          # The branch this run is on, empty on a tag. Non-empty collapses the cascade to
          # one `latest-<branch>` tag on the primary sink, so a branch build is testable
          # without a tag and without moving anything a consumer floats on.
          preview: ${{ github.ref_type == 'branch' && github.ref_name || '' }}
          # OUTPUT_REGISTRY: the forge-dependent PUSH target (kiota.ch / ghcr.io / …),
          # always threaded — empty => Docker Hub. NOT the per-namespace INPUT registries
          # (B19_DOCKER_REGISTRY & friends answer "where base images come FROM"); this
          # answers "where THIS project publishes TO". Set per forge (org var = default,
          # repo var = project-wise override). Ignored when `refs` below is present.
          registry: ${{ vars.OUTPUT_REGISTRY }}
          # Every destination this forge's route declares, each reference composed by
          # the sink that declared it — so one archive lands under whatever path grammar
          # each registry wants. Credentials key on the SINK name.
          refs: |
            kiota kiota.ch/projectfile/ci:latest
          # This CELL's destination, off the publish axis: the job runs one cell per
          # place the archive goes, so a registry refusing a push fails only its own.
          sink: ${{ matrix.M6E_PUBLISH_SINK }}
  published:
    runs-on: docker
    needs: ["binaries-are-released", "publish-image", "ready-to-publish"]
    steps:
      - run: echo published
  ready-to-publish:
    runs-on: docker
    needs: ["artifacts-are-ok"]
    steps:
      - run: echo ready-to-publish
  secrets-ready:
    runs-on: docker
    needs: ["image-is-built"]
    steps:
      - run: echo secrets-ready
  source-is-compliant:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: i18n-check
        if: vars.CI_SKIP_SOURCE_IS_COMPLIANT != 'true' && vars.CI_SKIP_I18N_CHECK != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_MISC_TOOLS_IMAGE || format('{0}/d9t/misc-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-i18n check
      - name: reuse-lint
        if: vars.CI_SKIP_SOURCE_IS_COMPLIANT != 'true' && vars.CI_SKIP_REUSE_LINT != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_PYTHON_TOOLS_IMAGE || format('{0}/d9t/python-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: reuse lint
  source-is-ok:
    runs-on: docker
    needs: ["source-is-compliant", "source-is-secure", "source-is-tested", "source-passes-lint"]
    steps:
      - run: echo source-is-ok
  source-is-secure:
    runs-on: docker
    env:
      OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY: /app/.cache/osv
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: grype-scan-source
        if: vars.CI_SKIP_SOURCE_IS_SECURE != 'true' && vars.CI_SKIP_GRYPE_SCAN_SOURCE != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-grype
          env: |-
            M6E_SHARED_CACHE=Y
          mounts: /app/data/ci-cache/grype-db:/app/.cache/grype:rw
      - name: osv-scanner-scan-source
        if: vars.CI_SKIP_SOURCE_IS_SECURE != 'true' && vars.CI_SKIP_OSV_SCANNER_SCAN_SOURCE != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-osv-scanner --offline-vulnerabilities
          env: |-
            OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=/app/.cache/osv
            M6E_SHARED_CACHE=Y
          mounts: /app/data/ci-cache/osv-db:/app/.cache/osv:rw
      - name: trivy-scan-source
        if: vars.CI_SKIP_SOURCE_IS_SECURE != 'true' && vars.CI_SKIP_TRIVY_SCAN_SOURCE != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-trivy fs
          env: |-
            M6E_SHARED_CACHE=Y
            TRIVY_CACHE_BACKEND
          mounts: /app/data/ci-cache/trivy-db:/app/.cache/trivy:rw
      - uses: actions/upload-artifact@v3
        if: ${{ always() }}
        with:
          name: reports-source-is-secure-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
  source-is-tested:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: go-test
        if: vars.CI_SKIP_SOURCE_IS_TESTED != 'true' && vars.CI_SKIP_GO_TEST != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.GO_TOOL_IMAGE || format('{0}/b19/go', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: go test -coverprofile=coverage.out ./...
          env: |-
            GOPROXY
          mounts: /app/data/ci-cache/go:/app/.cache/go:rw
  source-passes-lint:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: auto-cffr-validate
        if: vars.CI_SKIP_SOURCE_PASSES_LINT != 'true' && vars.CI_SKIP_AUTO_CFFR_VALIDATE != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_R_TOOLS_IMAGE || format('{0}/d9t/r-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-cffr-validate
      - name: auto-golangci-lint
        if: vars.CI_SKIP_SOURCE_PASSES_LINT != 'true' && vars.CI_SKIP_AUTO_GOLANGCI_LINT != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-golangci-lint
          env: |-
            GOPROXY
          mounts: /app/data/ci-cache/go:/app/.cache/go:rw
      - name: auto-gosec
        if: vars.CI_SKIP_SOURCE_PASSES_LINT != 'true' && vars.CI_SKIP_AUTO_GOSEC != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-gosec
          env: |-
            GOPROXY
          mounts: /app/data/ci-cache/go:/app/.cache/go:rw
      - name: auto-jsonlint
        if: vars.CI_SKIP_SOURCE_PASSES_LINT != 'true' && vars.CI_SKIP_AUTO_JSONLINT != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_JS_TOOLS_IMAGE || format('{0}/d9t/js-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-jsonlint
      - name: auto-shellcheck
        if: vars.CI_SKIP_SOURCE_PASSES_LINT != 'true' && vars.CI_SKIP_AUTO_SHELLCHECK != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_MISC_TOOLS_IMAGE || format('{0}/d9t/misc-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-shellcheck
      - name: auto-yamllint
        if: vars.CI_SKIP_SOURCE_PASSES_LINT != 'true' && vars.CI_SKIP_AUTO_YAMLLINT != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_PYTHON_TOOLS_IMAGE || format('{0}/d9t/python-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-yamllint
      - name: auto-zizmor
        if: vars.CI_SKIP_SOURCE_PASSES_LINT != 'true' && vars.CI_SKIP_AUTO_ZIZMOR != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.D9T_RUST_TOOLS_IMAGE || format('{0}/d9t/rust-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-zizmor
      - name: go-vet
        if: vars.CI_SKIP_SOURCE_PASSES_LINT != 'true' && vars.CI_SKIP_GO_VET != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.GO_TOOL_IMAGE || format('{0}/b19/go', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: go vet ./...
          env: |-
            GOPROXY
          mounts: /app/data/ci-cache/go:/app/.cache/go:rw
      - name: hadolint
        if: vars.CI_SKIP_SOURCE_PASSES_LINT != 'true' && vars.CI_SKIP_HADOLINT != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.HADOLINT_IMAGE || 'hadolint/hadolint' }}
          version: v2.15.1
          pull: missing
          run: hadolint Dockerfile
      - name: ignorelint-check
        if: vars.CI_SKIP_SOURCE_PASSES_LINT != 'true' && vars.CI_SKIP_IGNORELINT_CHECK != 'true'
        uses: projectfile/actions/run-tool@v1
        with:
          image: ${{ vars.IGNORELINT_IMAGE || format('{0}/damian-buho/ignorelint', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: ignorelint
