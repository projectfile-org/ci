---
name: check-outdated
"on":
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
env:
  M6E_TAG: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
  M6E_RUN_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
  GOPROXY: https://kiota.ch/api/packages/projectfile/go,direct
jobs:
  check-outdated:
    runs-on: docker
    if: (github.event_name == 'workflow_dispatch') || (github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: check-outdated-go
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.GO_TOOL_IMAGE || format('{0}/b19/go', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: go list -u -m all
          env: |-
            GOPROXY
          mounts: /app/data/ci-cache/go:/app/.cache/go:rw
