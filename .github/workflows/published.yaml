# Generated by pf-ci from org.projectfile.ci — DO NOT EDIT.
# Regenerate with: pf-ci generate --target gha
# A freshness gate (pf-ci generate --check) runs in CI so this file cannot
# silently drift from the source DAG.
---
name: published
"on":
  push:
    branches: ["**"]
  pull_request: {}
  workflow_dispatch:
    inputs:
      B19_COLOR:
        type: string
        default: "1"
      B19_FETCH_DOCKER_CACHE:
        type: string
        default: "Y"
      B19_FETCH_LOCAL_CACHE:
        type: string
        default: "Y"
      B19_OFFGRID_MODE:
        type: string
        default: "N"
      B19_UBUNTU_SERIES:
        type: string
        default: "resolute"
      B19_VERBOSITY:
        type: string
        default: "info"
      DESTINATION_DOCKER_REGISTRY:
        type: string
      GOPROXY:
        type: string
      LANG:
        type: string
      M6E_APT_CACHE_HOST:
        type: string
      M6E_APT_CACHE_PORT:
        type: string
      M6E_BUILD_DEBUG:
        type: string
      M6E_NEAR_CACHE_HOST:
        type: string
      M6E_NEAR_CACHE_PORT:
        type: string
      SOURCE_DOCKER_REGISTRY:
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false
env:
  M6E_TAG: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
  M6E_RUN_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
  GOPROXY: https://kiota.ch/api/packages/projectfile/go,https://proxy.golang.org,direct
  PF_CLI_IMAGE: ${{ vars.PF_CLI_IMAGE || format('{0}/cli:{1}', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/projectfile-org', vars.BASE_IMAGE_DEFAULT_VERSION || 'latest') }}
jobs:
  binaries-are-built:
    runs-on: ubuntu-26.04
    needs: ["documentation-passes-lint", "gpg-is-ready", "projectfile-is-ok", "release-tag", "runner-is-ready", "signing-is-ready", "source-is-compliant", "source-is-secure", "source-is-tested", "source-passes-lint"]
    if: ${{ !cancelled() && needs.documentation-passes-lint.result == 'success' && (needs.gpg-is-ready.result == 'success' || (needs.gpg-is-ready.result == 'skipped' && !((startsWith(github.ref, 'refs/heads/')) || (needs.release-tag.outputs.tag != '')))) && needs.projectfile-is-ok.result == 'success' && needs.release-tag.result == 'success' && needs.runner-is-ready.result == 'success' && (needs.signing-is-ready.result == 'success' || (needs.signing-is-ready.result == 'skipped' && !((startsWith(github.ref, 'refs/heads/')) || (needs.release-tag.outputs.tag != '')))) && needs.source-is-compliant.result == 'success' && needs.source-is-secure.result == 'success' && needs.source-is-tested.result == 'success' && needs.source-passes-lint.result == 'success' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)) }}
    strategy:
      matrix:
        TARGET_ARCH: ["amd64", "arm64", "riscv64"]
        TARGET_OS: ["linux", "darwin"]
        exclude:
          - TARGET_ARCH: "riscv64"
            TARGET_OS: "darwin"
    env:
      M6E_RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
      TARGET_ARCH: ${{ matrix.TARGET_ARCH }}
      TARGET_OS: ${{ matrix.TARGET_OS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: stamp go
        id: stamp-go
        if: (vars.CI_ONLY_TARGET_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_TARGET_ARCH), format(',{0},', matrix.TARGET_ARCH))) && (vars.CI_ONLY_TARGET_OS == '' || contains(format(',{0},', vars.CI_ONLY_TARGET_OS), format(',{0},', matrix.TARGET_OS))) && vars.CI_SKIP_BINARIES_ARE_BUILT != 'true' && vars.CI_SKIP_BUILD_BINARIES != 'true'
        run: echo "stamp=$(( $(date -u +%s) / 28800 ))" >> "$GITHUB_OUTPUT"
      - name: restore go
        id: restore-go
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: (vars.CI_ONLY_TARGET_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_TARGET_ARCH), format(',{0},', matrix.TARGET_ARCH))) && (vars.CI_ONLY_TARGET_OS == '' || contains(format(',{0},', vars.CI_ONLY_TARGET_OS), format(',{0},', matrix.TARGET_OS))) && vars.CI_SKIP_BINARIES_ARE_BUILT != 'true' && vars.CI_SKIP_BUILD_BINARIES != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/go
          key: ci-cache-go-${{ steps.stamp-go.outputs.stamp }}
          restore-keys: |
            ci-cache-go-
      - name: build-binaries
        if: (vars.CI_ONLY_TARGET_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_TARGET_ARCH), format(',{0},', matrix.TARGET_ARCH))) && (vars.CI_ONLY_TARGET_OS == '' || contains(format(',{0},', vars.CI_ONLY_TARGET_OS), format(',{0},', matrix.TARGET_OS))) && vars.CI_SKIP_BINARIES_ARE_BUILT != 'true' && vars.CI_SKIP_BUILD_BINARIES != 'true'
        uses: projectfile-org/actions/run-tool@7585a2fefdfeb15c12d1cdcc2944aaf3dea6f6e9 # v1
        with:
          image: ${{ vars.GO_TOOL_IMAGE || format('{0}/b19/go', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: .scripts/build-binaries.sh
          env: |-
            M6E_RELEASE_TAG=${{ needs.release-tag.outputs.tag }}
            TARGET_ARCH=${{ matrix.TARGET_ARCH }}
            TARGET_OS=${{ matrix.TARGET_OS }}
            GOARCH
            GOOS
            GOPROXY
          mounts: ${{ runner.temp }}/ci-cache/go:/app/.cache/go:rw
      - name: save go
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: ((vars.CI_ONLY_TARGET_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_TARGET_ARCH), format(',{0},', matrix.TARGET_ARCH))) && (vars.CI_ONLY_TARGET_OS == '' || contains(format(',{0},', vars.CI_ONLY_TARGET_OS), format(',{0},', matrix.TARGET_OS))) && vars.CI_SKIP_BINARIES_ARE_BUILT != 'true' && vars.CI_SKIP_BUILD_BINARIES != 'true') && steps.restore-go.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/go
          key: ci-cache-go-${{ steps.stamp-go.outputs.stamp }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: (vars.CI_ONLY_TARGET_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_TARGET_ARCH), format(',{0},', matrix.TARGET_ARCH))) && (vars.CI_ONLY_TARGET_OS == '' || contains(format(',{0},', vars.CI_ONLY_TARGET_OS), format(',{0},', matrix.TARGET_OS))) && vars.CI_SKIP_BINARIES_ARE_BUILT != 'true' && vars.CI_SKIP_BUILD_BINARIES != 'true'
        with:
          name: build-binaries-${{ matrix.TARGET_ARCH }}-${{ matrix.TARGET_OS }}-${{ github.run_id }}
          path: dist
          overwrite: true
  binaries-are-signed:
    runs-on: ubuntu-26.04
    needs: ["binaries-are-built", "release-tag"]
    if: ${{ !cancelled() && needs.binaries-are-built.result == 'success' && needs.release-tag.result == 'success' && (needs.release-tag.outputs.tag != '') }}
    env:
      M6E_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      M6E_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: vars.CI_SKIP_BINARIES_ARE_BUILT != 'true' && vars.CI_SKIP_BUILD_BINARIES != 'true'
        with:
          name: build-binaries-amd64-linux-${{ github.run_id }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: vars.CI_SKIP_BINARIES_ARE_BUILT != 'true' && vars.CI_SKIP_BUILD_BINARIES != 'true'
        with:
          name: build-binaries-amd64-darwin-${{ github.run_id }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: vars.CI_SKIP_BINARIES_ARE_BUILT != 'true' && vars.CI_SKIP_BUILD_BINARIES != 'true'
        with:
          name: build-binaries-arm64-linux-${{ github.run_id }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: vars.CI_SKIP_BINARIES_ARE_BUILT != 'true' && vars.CI_SKIP_BUILD_BINARIES != 'true'
        with:
          name: build-binaries-arm64-darwin-${{ github.run_id }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: vars.CI_SKIP_BINARIES_ARE_BUILT != 'true' && vars.CI_SKIP_BUILD_BINARIES != 'true'
        with:
          name: build-binaries-riscv64-linux-${{ github.run_id }}
          path: dist
      - name: gpg-key-file
        if: vars.CI_SKIP_BINARIES_ARE_SIGNED != 'true' && vars.CI_SKIP_GPG_KEY_FILE != 'true'
        run: .makefile/core/scripts/gpg-key-file.sh
      - name: stamp pf
        id: stamp-pf
        if: vars.CI_SKIP_BINARIES_ARE_SIGNED != 'true' && vars.CI_SKIP_GPG_SIGN != 'true'
        run: echo "stamp=$(( $(date -u +%s) / 28800 ))" >> "$GITHUB_OUTPUT"
      - name: restore pf
        id: restore-pf
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: vars.CI_SKIP_BINARIES_ARE_SIGNED != 'true' && vars.CI_SKIP_GPG_SIGN != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/pf
          key: ci-cache-pf-${{ steps.stamp-pf.outputs.stamp }}
          restore-keys: |
            ci-cache-pf-
      - name: gpg-sign
        if: vars.CI_SKIP_BINARIES_ARE_SIGNED != 'true' && vars.CI_SKIP_GPG_SIGN != 'true'
        uses: projectfile-org/actions/run-tool@7585a2fefdfeb15c12d1cdcc2944aaf3dea6f6e9 # v1
        with:
          image: ${{ vars.D9T_MISC_TOOLS_IMAGE || format('{0}/d9t/misc-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-gpg-sign
          env: |-
            M6E_GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }}
          mounts: ${{ runner.temp }}/ci-cache/pf:/app/.cache/pf:rw
      - name: save pf
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: (vars.CI_SKIP_BINARIES_ARE_SIGNED != 'true' && vars.CI_SKIP_GPG_SIGN != 'true') && steps.restore-pf.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/pf
          key: ci-cache-pf-${{ steps.stamp-pf.outputs.stamp }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: vars.CI_SKIP_BINARIES_ARE_SIGNED != 'true' && vars.CI_SKIP_GPG_SIGN != 'true'
        with:
          name: gpg-sign-${{ github.run_id }}
          path: dist
          overwrite: true
  container-is-verified:
    runs-on: ubuntu-26.04
    needs: ["image-is-built"]
    if: ${{ !cancelled() && needs.image-is-built.result == 'success' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)) }}
    strategy:
      matrix:
        M6E_ARCH: ["amd64"]
    env:
      M6E_ARCH: ${{ matrix.M6E_ARCH }}
      M6E_IMAGE_FULLNAME: projectfile/ci:${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}-${{ github.run_id }}-${{ matrix.M6E_ARCH }}
      M6E_COMPOSE_PROJECT_NAME: ci-projectfile-ci-${{ matrix.M6E_ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
      M6E_CONTAINER_INSTANCE: ci-projectfile-ci-${{ matrix.M6E_ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      # A withheld pin leaves this node nowhere to run; failing here keeps its gate from passing green
      - name: refuse a withheld M6E_ARCH
        if: vars.CI_ONLY_M6E_ARCH != '' && !contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), ',amd64,') && vars.CI_SKIP_CONTAINER_IS_VERIFIED != 'true'
        run: echo "CI_ONLY_M6E_ARCH withholds M6E_ARCH=amd64, the one value this node runs on" >&2; exit 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_BUILT != 'true' && vars.CI_SKIP_CONTAINER_BUILD != 'true'
        with:
          name: image-${{ matrix.M6E_ARCH }}-${{ github.run_id }}
      # The archive enters the runner's SHARED image store, where a sibling job's reap
      # can delete a layer record mid-copy — podman then buries the real cause under a
      # four-transport probe that claims the tar matches no supported format. The retry
      # for that class lives in the pinned action, not inline (Law 2).
      - uses: projectfile-org/actions/container-load@7585a2fefdfeb15c12d1cdcc2944aaf3dea6f6e9 # v1
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH)))
        with:
          archive: image-${{ matrix.M6E_ARCH }}-${{ github.run_id }}.tar
      - name: dc-pull
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGES_ARE_OK != 'true' && vars.CI_SKIP_DC_PULL != 'true'
        run: M6E_COMPOSE_FILE=.compose/pipeline.yaml .makefile/container/scripts/compose-pull.sh
      - name: dc-up-d
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_CONTAINER_IS_STARTED != 'true' && vars.CI_SKIP_DC_UP_D != 'true'
        run: timeout --kill-after=10s "${M6E_COMPOSE_UP_TIMEOUT:-300}s" docker compose --project-name "$M6E_COMPOSE_PROJECT_NAME" --file .compose/pipeline.yaml up --detach --renew-anon-volumes --no-build </dev/null
      - name: configuration-check
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_CONTAINER_IS_TESTED != 'true' && vars.CI_SKIP_CONFIGURATION_CHECK != 'true'
        run: .makefile/container/scripts/configuration-capture.sh --check --default-lang= es uk
      - name: container-test
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_CONTAINER_IS_TESTED != 'true' && vars.CI_SKIP_CONTAINER_TEST != 'true'
        uses: projectfile-org/actions/container-exec@7585a2fefdfeb15c12d1cdcc2944aaf3dea6f6e9 # v1
        with:
          container: ${{ env.M6E_CONTAINER_INSTANCE }}
          run: test.d
      - name: usage-check
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_CONTAINER_IS_TESTED != 'true' && vars.CI_SKIP_USAGE_CHECK != 'true'
        run: .makefile/container/scripts/usage-capture.sh --check --image --default-lang= es uk
      - name: dc-diagnose
        if: ${{ always() }}
        run: .makefile/container/scripts/compose-diagnose.sh
      - name: dc-down
        if: ${{ always() }}
        run: docker compose --project-name "$M6E_COMPOSE_PROJECT_NAME" --file .compose/pipeline.yaml down --volumes </dev/null
      # Reap the run-scoped image tag AND the live stack's network. Both are unique per
      # run (the tag carries M6E_RUN_SCOPE, the network the run-scoped project name), so
      # without this the runner's docker store gains one image per run forever AND a
      # failed/timed-out `up` can orphan the network (compose reports the removal error
      # WITHOUT failing). RmiImage and RmNetwork are always PAIRED (single assignment
      # site), so one docker-cleanup step reaps both — the imperative reaps + their
      # `inspect` guard live in the pinned action, not inline (Law 2).
      - if: ${{ always() }}
        uses: projectfile-org/actions/docker-cleanup@7585a2fefdfeb15c12d1cdcc2944aaf3dea6f6e9 # v1
        with:
          image: projectfile/ci:${{ env.M6E_TAG }}-${{ github.run_id }}-${{ matrix.M6E_ARCH }}
          network: ci-projectfile-ci-${{ matrix.M6E_ARCH }}-${{ env.M6E_RUN_SCOPE }}-network
  documentation-passes-lint:
    runs-on: ubuntu-26.04
    needs: ["gpg-is-ready", "release-tag", "runner-is-ready", "signing-is-ready"]
    if: ${{ !cancelled() && (needs.gpg-is-ready.result == 'success' || (needs.gpg-is-ready.result == 'skipped' && !((startsWith(github.ref, 'refs/heads/')) || (needs.release-tag.outputs.tag != '')))) && needs.release-tag.result == 'success' && needs.runner-is-ready.result == 'success' && (needs.signing-is-ready.result == 'success' || (needs.signing-is-ready.result == 'skipped' && !((startsWith(github.ref, 'refs/heads/')) || (needs.release-tag.outputs.tag != '')))) && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: auto-markdownlint
        if: vars.CI_SKIP_DOCUMENTATION_PASSES_LINT != 'true' && vars.CI_SKIP_AUTO_MARKDOWNLINT != 'true'
        uses: projectfile-org/actions/run-tool@7585a2fefdfeb15c12d1cdcc2944aaf3dea6f6e9 # v1
        with:
          image: ${{ vars.D9T_JS_TOOLS_IMAGE || format('{0}/d9t/js-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-markdownlint
      - name: auto-textlint
        if: vars.CI_SKIP_DOCUMENTATION_PASSES_LINT != 'true' && vars.CI_SKIP_AUTO_TEXTLINT != 'true'
        uses: projectfile-org/actions/run-tool@7585a2fefdfeb15c12d1cdcc2944aaf3dea6f6e9 # v1
        with:
          image: ${{ vars.D9T_JS_TOOLS_IMAGE || format('{0}/d9t/js-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-textlint
  go-install-is-ok:
    runs-on: ubuntu-26.04
    needs: ["release-is-published", "release-tag"]
    if: ${{ !cancelled() && needs.release-is-published.result == 'success' && needs.release-tag.result == 'success' && (needs.release-tag.outputs.tag != '') }}
    env:
      M6E_RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: go-install
        if: vars.CI_SKIP_GO_INSTALL_IS_OK != 'true' && vars.CI_SKIP_GO_INSTALL != 'true'
        uses: projectfile-org/actions/run-tool@7585a2fefdfeb15c12d1cdcc2944aaf3dea6f6e9 # v1
        with:
          image: ${{ vars.GO_TOOL_IMAGE || format('{0}/b19/go', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          # `advisory: true` — run.sh reports the failure with its named cause, then returns
          # 0. It rides the ACTION because that decode already lives there, so one code path
          # behaves the same on every forge however each implements the step-level knob.
          advisory: "true"
          run: .makefile/library/scripts/go-install-is-ok.sh "${M6E_RELEASE_TAG}" pf-ci projectfile.org/projectfile/ci/v3/cmd/pf-ci
          env: |-
            M6E_RELEASE_TAG=${{ needs.release-tag.outputs.tag }}
  gpg-is-ready:
    runs-on: ubuntu-26.04
    needs: ["release-tag"]
    if: ${{ !cancelled() && needs.release-tag.result == 'success' && ((startsWith(github.ref, 'refs/heads/')) || (needs.release-tag.outputs.tag != '')) }}
    env:
      M6E_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      M6E_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: gpg-key-file-preflight
        if: vars.CI_SKIP_GPG_IS_READY != 'true' && vars.CI_SKIP_GPG_KEY_FILE_PREFLIGHT != 'true'
        run: .makefile/core/scripts/gpg-key-file.sh
      - name: gpg-preflight
        if: vars.CI_SKIP_GPG_IS_READY != 'true' && vars.CI_SKIP_GPG_PREFLIGHT != 'true'
        uses: projectfile-org/actions/run-tool@7585a2fefdfeb15c12d1cdcc2944aaf3dea6f6e9 # v1
        with:
          image: ${{ vars.D9T_MISC_TOOLS_IMAGE || format('{0}/d9t/misc-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-gpg-sign --preflight
          env: |-
            M6E_GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }}
  image-has-sbom:
    runs-on: ubuntu-26.04
    needs: ["image-is-built", "release-tag"]
    if: ${{ !cancelled() && needs.image-is-built.result == 'success' && needs.release-tag.result == 'success' && (needs.release-tag.outputs.tag != '') }}
    strategy:
      matrix:
        M6E_ARCH: ["amd64", "arm64", "riscv64"]
    env:
      M6E_ARCH: ${{ matrix.M6E_ARCH }}
      M6E_IMAGE_ARCHIVE: image-${{ matrix.M6E_ARCH }}-${{ github.run_id }}.tar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
