    needs: ["image-is-built"]
    if: ${{ !cancelled() && needs.image-is-built.result == 'success' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)) }}
    strategy:
      matrix:
        M6E_ARCH: ["amd64", "arm64", "riscv64"]
    env:
      M6E_ARCH: ${{ matrix.M6E_ARCH }}
      M6E_IMAGE_ARCHIVE: image-${{ matrix.M6E_ARCH }}-${{ github.run_id }}.tar
      CI_IGNORE_VULNERABILITIES: ${{ vars.CI_IGNORE_VULNERABILITIES }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_BUILT != 'true' && vars.CI_SKIP_CONTAINER_BUILD != 'true'
        with:
          name: image-${{ matrix.M6E_ARCH }}-${{ github.run_id }}
      - name: stamp grype-db
        id: stamp-grype-db
        if: (!cancelled()) && (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_SECURE != 'true' && vars.CI_SKIP_GRYPE_SCAN_TAR != 'true'
        run: echo "stamp=$(( $(date -u +%s) / 28800 ))" >> "$GITHUB_OUTPUT"
      - name: restore grype-db
        id: restore-grype-db
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: (!cancelled()) && (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_SECURE != 'true' && vars.CI_SKIP_GRYPE_SCAN_TAR != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/grype-db
          key: ci-cache-grype-db-${{ steps.stamp-grype-db.outputs.stamp }}
          restore-keys: |
            ci-cache-grype-db-
      - name: grype-scan-tar
        if: (!cancelled()) && (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_SECURE != 'true' && vars.CI_SKIP_GRYPE_SCAN_TAR != 'true'
        uses: projectfile-org/actions/run-tool@7585a2fefdfeb15c12d1cdcc2944aaf3dea6f6e9 # v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-grype image
          env: |-
            M6E_ARCH=${{ matrix.M6E_ARCH }}
            M6E_IMAGE_ARCHIVE=image-${{ matrix.M6E_ARCH }}-${{ github.run_id }}.tar
            CI_IGNORE_VULNERABILITIES=${{ vars.CI_IGNORE_VULNERABILITIES }}
            M6E_SHARED_CACHE=N
          mounts: ${{ runner.temp }}/ci-cache/grype-db:/app/.cache/grype:rw
      - name: save grype-db
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: ((!cancelled()) && (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_SECURE != 'true' && vars.CI_SKIP_GRYPE_SCAN_TAR != 'true') && steps.restore-grype-db.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/grype-db
          key: ci-cache-grype-db-${{ steps.stamp-grype-db.outputs.stamp }}
      - name: stamp trivy-db
        id: stamp-trivy-db
        if: (!cancelled()) && (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_SECURE != 'true' && vars.CI_SKIP_TRIVY_SCAN_TAR != 'true'
        run: echo "stamp=$(( $(date -u +%s) / 28800 ))" >> "$GITHUB_OUTPUT"
      - name: restore trivy-db
        id: restore-trivy-db
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: (!cancelled()) && (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_SECURE != 'true' && vars.CI_SKIP_TRIVY_SCAN_TAR != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/trivy-db
          key: ci-cache-trivy-db-${{ steps.stamp-trivy-db.outputs.stamp }}
          restore-keys: |
            ci-cache-trivy-db-
      - name: trivy-scan-tar
        if: (!cancelled()) && (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_SECURE != 'true' && vars.CI_SKIP_TRIVY_SCAN_TAR != 'true'
        uses: projectfile-org/actions/run-tool@7585a2fefdfeb15c12d1cdcc2944aaf3dea6f6e9 # v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-trivy image
          env: |-
            M6E_ARCH=${{ matrix.M6E_ARCH }}
            M6E_IMAGE_ARCHIVE=image-${{ matrix.M6E_ARCH }}-${{ github.run_id }}.tar
            CI_IGNORE_VULNERABILITIES=${{ vars.CI_IGNORE_VULNERABILITIES }}
            M6E_SHARED_CACHE=N
            TRIVY_CACHE_BACKEND
          mounts: ${{ runner.temp }}/ci-cache/trivy-db:/app/.cache/trivy:rw
      - name: save trivy-db
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: ((!cancelled()) && (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_SECURE != 'true' && vars.CI_SKIP_TRIVY_SCAN_TAR != 'true') && steps.restore-trivy-db.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/trivy-db
          key: ci-cache-trivy-db-${{ steps.stamp-trivy-db.outputs.stamp }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: reports-image-is-secure-${{ matrix.M6E_ARCH }}-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          overwrite: true
  projectfile-is-ok:
    runs-on: ubuntu-26.04
    needs: ["projectfile-is-valid"]
    if: ${{ !cancelled() && needs.projectfile-is-valid.result == 'success' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: pf-bridge-check
        if: vars.CI_SKIP_PROJECTFILE_IS_OK != 'true' && vars.CI_SKIP_PF_BRIDGE_CHECK != 'true'
        uses: projectfile-org/actions/run-tool@7585a2fefdfeb15c12d1cdcc2944aaf3dea6f6e9 # v1
        with:
          image: ${{ vars.PF_BRIDGE_IMAGE || format('{0}/bridge', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/projectfile-org') }}
          version: ${{ env.M6E_TAG }}
          run: pf-bridge check
  projectfile-is-valid:
    runs-on: ubuntu-26.04
    needs: ["gpg-is-ready", "release-tag", "runner-is-ready", "signing-is-ready"]
    if: ${{ !cancelled() && (needs.gpg-is-ready.result == 'success' || (needs.gpg-is-ready.result == 'skipped' && !((startsWith(github.ref, 'refs/heads/')) || (needs.release-tag.outputs.tag != '')))) && needs.release-tag.result == 'success' && needs.runner-is-ready.result == 'success' && (needs.signing-is-ready.result == 'success' || (needs.signing-is-ready.result == 'skipped' && !((startsWith(github.ref, 'refs/heads/')) || (needs.release-tag.outputs.tag != '')))) && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: pf-validate
        if: vars.CI_SKIP_PROJECTFILE_IS_VALID != 'true' && vars.CI_SKIP_PF_VALIDATE != 'true'
        uses: projectfile-org/actions/run-tool@7585a2fefdfeb15c12d1cdcc2944aaf3dea6f6e9 # v1
        with:
          image: ${{ vars.PF_CLI_IMAGE || format('{0}/cli', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/projectfile-org') }}
          version: ${{ env.M6E_TAG }}
          run: pf-cli validate
  published:
    runs-on: ubuntu-26.04
    needs: ["binaries-are-built", "binaries-are-signed", "container-is-verified", "documentation-passes-lint", "go-install-is-ok", "gpg-is-ready", "image-has-sbom", "image-is-built", "image-is-published", "image-is-secure", "projectfile-is-ok", "projectfile-is-valid", "release-is-published", "release-notes-are-published", "release-tag", "runner-is-ready", "signing-is-ready", "source-is-compliant", "source-is-secure", "source-is-tested", "source-passes-lint"]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    steps:
      - name: published verdict
        run: |
          passed=0 skipped=0 failed=0
          for pair in \
            "binaries-are-built=${{ needs.binaries-are-built.result }}" \
            "binaries-are-signed=${{ needs.binaries-are-signed.result }}" \
            "container-is-verified=${{ needs.container-is-verified.result }}" \
            "documentation-passes-lint=${{ needs.documentation-passes-lint.result }}" \
            "go-install-is-ok=${{ needs.go-install-is-ok.result }}" \
            "gpg-is-ready=${{ needs.gpg-is-ready.result }}" \
            "image-has-sbom=${{ needs.image-has-sbom.result }}" \
            "image-is-built=${{ needs.image-is-built.result }}" \
            "image-is-published=${{ needs.image-is-published.result }}" \
            "image-is-secure=${{ needs.image-is-secure.result }}" \
            "projectfile-is-ok=${{ needs.projectfile-is-ok.result }}" \
            "projectfile-is-valid=${{ needs.projectfile-is-valid.result }}" \
            "release-is-published=${{ needs.release-is-published.result }}" \
            "release-notes-are-published=${{ needs.release-notes-are-published.result }}" \
            "release-tag=${{ needs.release-tag.result }}" \
            "runner-is-ready=${{ needs.runner-is-ready.result }}" \
            "signing-is-ready=${{ needs.signing-is-ready.result }}" \
            "source-is-compliant=${{ needs.source-is-compliant.result }}" \
            "source-is-secure=${{ needs.source-is-secure.result }}" \
            "source-is-tested=${{ needs.source-is-tested.result }}" \
            "source-passes-lint=${{ needs.source-passes-lint.result }}"; do
            echo "verdict need=${pair%%=*} result=${pair#*=}"
            case "${pair#*=}" in
              success) passed=$((passed + 1)) ;;
              skipped) skipped=$((skipped + 1)) ;;
              *) failed=$((failed + 1)) ;;
            esac
          done
          status=success; event=goal.succeeded
          if [ "${failed}" -gt 0 ]; then
            status=failure; event=goal.failed
          elif [ "${passed}" -eq 0 ]; then
            status=skipped; event=goal.skipped
          fi
          echo "verdict goal=published status=${status} passed=${passed} skipped=${skipped} failed=${failed}"
          [ "${failed}" -eq 0 ]
  release-is-published:
    runs-on: ubuntu-26.04
