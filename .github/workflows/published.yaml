        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && (vars.CI_ONLY_M6E_PUBLISH_SINK == '' || contains(format(',{0},', vars.CI_ONLY_M6E_PUBLISH_SINK), format(',{0},', matrix.M6E_PUBLISH_SINK))) && (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), ',riscv64,'))
        with:
          name: image-riscv64-${{ github.run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && (vars.CI_ONLY_M6E_PUBLISH_SINK == '' || contains(format(',{0},', vars.CI_ONLY_M6E_PUBLISH_SINK), format(',{0},', matrix.M6E_PUBLISH_SINK)))
        with:
          name: syft-sbom-tar-${{ matrix.M6E_ARCH }}-${{ github.run_id }}
          path: reports
      - name: oci-push
        # The cell's run-time override gate, on the STEP because a job `if:` may not read the matrix context
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && (vars.CI_ONLY_M6E_PUBLISH_SINK == '' || contains(format(',{0},', vars.CI_ONLY_M6E_PUBLISH_SINK), format(',{0},', matrix.M6E_PUBLISH_SINK))) && vars.CI_SKIP_PUBLISH_IMAGE != 'true' && vars.CI_SKIP_OCI_PUSH != 'true'
        uses: projectfile-org/actions/oci-push@78f06c9316d295ea7b646ad1bdac87b76b7f999a # v1
        with:
          # One tar per DECLARED architecture, published together as a manifest list at
          # each cascade tag. Per-arch TAGS are deliberately not published: they are
          # scaffolding, and a registry that cannot delete a tag keeps them forever.
          archives: |
            amd64 image-amd64-${{ github.run_id }}
            arm64 image-arm64-${{ github.run_id }}
            riscv64 image-riscv64-${{ github.run_id }}
          # The arches this scope may publish, the same list the per-arch downloads above honour
          only-arches: ${{ vars.CI_ONLY_M6E_ARCH }}
          image: projectfile/ci:${{ env.M6E_TAG }}-${{ github.run_id }}
          version: ${{ github.ref_name }}
          # The branch this run is on, empty on a tag. Non-empty collapses the cascade to
          # one `latest-<branch>` tag on the primary sink, so a branch build is testable
          # without a tag and without moving anything a consumer floats on.
          preview: ${{ github.ref_type == 'branch' && github.ref_name || '' }}
          # OUTPUT_REGISTRY: the forge-dependent PUSH target (kiota.ch / ghcr.io / …),
          # always threaded — empty => Docker Hub. NOT the per-namespace INPUT registries
          # (B19_DOCKER_REGISTRY & friends answer "where base images come FROM"); this
          # answers "where THIS project publishes TO". Set per forge (org var = default,
          # repo var = project-wise override). Ignored when `refs` below is present.
          registry: ${{ vars.OUTPUT_REGISTRY }}
          # Every destination this forge's route declares, each reference composed by
          # the sink that declared it — so one archive lands under whatever path grammar
          # each registry wants. Credentials key on the SINK name.
          refs: |
            ghcr ghcr.io/projectfile-org/ci:latest
          # This CELL's destination, off the publish axis: the job runs one cell per
          # place the archive goes, so a registry refusing a push fails only its own.
          sink: ${{ matrix.M6E_PUBLISH_SINK }}
      - name: cosign-key-file
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && (vars.CI_ONLY_M6E_PUBLISH_SINK == '' || contains(format(',{0},', vars.CI_ONLY_M6E_PUBLISH_SINK), format(',{0},', matrix.M6E_PUBLISH_SINK))) && vars.CI_SKIP_IMAGE_IS_SIGNED != 'true' && vars.CI_SKIP_COSIGN_KEY_FILE != 'true'
        run: .makefile/b19/scripts/cosign-key-file.sh
      - name: cosign-sign
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && (vars.CI_ONLY_M6E_PUBLISH_SINK == '' || contains(format(',{0},', vars.CI_ONLY_M6E_PUBLISH_SINK), format(',{0},', matrix.M6E_PUBLISH_SINK))) && vars.CI_SKIP_IMAGE_IS_SIGNED != 'true' && vars.CI_SKIP_COSIGN_SIGN != 'true'
        uses: projectfile-org/actions/run-tool@78f06c9316d295ea7b646ad1bdac87b76b7f999a # v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-cosign sign
          env: |-
            M6E_ARCH=${{ matrix.M6E_ARCH }}
            COSIGN_PASSWORD=${{ secrets.COSIGN_PASSWORD }}
      - name: cosign-attest
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && (vars.CI_ONLY_M6E_PUBLISH_SINK == '' || contains(format(',{0},', vars.CI_ONLY_M6E_PUBLISH_SINK), format(',{0},', matrix.M6E_PUBLISH_SINK))) && vars.CI_SKIP_IMAGE_IS_ATTESTED != 'true' && vars.CI_SKIP_COSIGN_ATTEST != 'true'
        uses: projectfile-org/actions/run-tool@78f06c9316d295ea7b646ad1bdac87b76b7f999a # v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-cosign attest
          env: |-
            M6E_ARCH=${{ matrix.M6E_ARCH }}
            COSIGN_PASSWORD=${{ secrets.COSIGN_PASSWORD }}
  image-is-built:
    runs-on: ${{ matrix.M6E_RUNNER }}
    needs: ["fetched", "inputs-are-ok"]
    permissions:
      actions: write
      contents: read
    concurrency:
      group: build-${{ github.repository }}-${{ toJSON(matrix) }}
      cancel-in-progress: false
    strategy:
      max-parallel: 2
      matrix:
        M6E_ARCH: ["amd64", "arm64", "riscv64"]
        include:
          - M6E_ARCH: "amd64"
            M6E_RUNNER: "ubuntu-latest"
          - M6E_ARCH: "arm64"
            M6E_RUNNER: "ubuntu-24.04-arm"
          - M6E_ARCH: "riscv64"
            M6E_RUNNER: "ubuntu-latest"
    env:
      M6E_ARCH: ${{ matrix.M6E_ARCH }}
      M6E_NAMESPACE: projectfile
      M6E_PROJECT: ci
      B19_COLOR: ${{ inputs.B19_COLOR || vars.B19_COLOR || '1' }}
      B19_FETCH_DOCKER_CACHE: ${{ inputs.B19_FETCH_DOCKER_CACHE || vars.B19_FETCH_DOCKER_CACHE || 'Y' }}
      B19_FETCH_LOCAL_CACHE: ${{ inputs.B19_FETCH_LOCAL_CACHE || vars.B19_FETCH_LOCAL_CACHE || 'Y' }}
      B19_GO_BASE_IMAGE: ${{ vars.B19_GO_BASE_IMAGE || format('{0}/b19/go:{1}', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho', vars.BASE_IMAGE_DEFAULT_VERSION || 'latest') }}
      B19_OFFGRID_MODE: ${{ inputs.B19_OFFGRID_MODE || vars.B19_OFFGRID_MODE || 'N' }}
      B19_UBUNTU_BASE_IMAGE: ${{ vars.B19_UBUNTU_BASE_IMAGE || format('{0}/b19/ubuntu/{1}:{2}', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho', vars.B19_UBUNTU_SERIES || 'resolute', vars.BASE_IMAGE_DEFAULT_VERSION || 'latest') }}
      B19_UBUNTU_SERIES: ${{ inputs.B19_UBUNTU_SERIES || vars.B19_UBUNTU_SERIES || 'resolute' }}
      B19_VERBOSITY: ${{ inputs.B19_VERBOSITY || vars.B19_VERBOSITY || 'info' }}
      DESTINATION_DOCKER_REGISTRY: ${{ inputs.DESTINATION_DOCKER_REGISTRY || vars.DESTINATION_DOCKER_REGISTRY }}
      GOPROXY: ${{ inputs.GOPROXY || vars.GOPROXY }}
      LANG: ${{ inputs.LANG || vars.LANG }}
      M6E_APT_CACHE_HOST: ${{ inputs.M6E_APT_CACHE_HOST || vars.M6E_APT_CACHE_HOST }}
      M6E_APT_CACHE_PORT: ${{ inputs.M6E_APT_CACHE_PORT || vars.M6E_APT_CACHE_PORT }}
      M6E_BUILD_DEBUG: ${{ inputs.M6E_BUILD_DEBUG || vars.M6E_BUILD_DEBUG }}
      M6E_NEAR_CACHE_HOST: ${{ inputs.M6E_NEAR_CACHE_HOST || vars.M6E_NEAR_CACHE_HOST }}
      M6E_NEAR_CACHE_PORT: ${{ inputs.M6E_NEAR_CACHE_PORT || vars.M6E_NEAR_CACHE_PORT }}
      SOURCE_DOCKER_REGISTRY: ${{ inputs.SOURCE_DOCKER_REGISTRY || vars.SOURCE_DOCKER_REGISTRY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: use an isolated buildx builder
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_BUILT != 'true' && vars.CI_SKIP_CONTAINER_BUILD != 'true'
        # the docker driver's image exporter needs the host's containerd store; docker-container carries its own, so no host config or restart is needed on any GHA runner flavor.
        run: docker buildx create --name ci --driver docker-container --use
      - name: container-build
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_BUILT != 'true' && vars.CI_SKIP_CONTAINER_BUILD != 'true'
        uses: projectfile-org/actions/container-build/buildx@78f06c9316d295ea7b646ad1bdac87b76b7f999a # v1
        with:
          artifact-name: image-${{ matrix.M6E_ARCH }}-${{ github.run_id }}
          image: projectfile/ci:${{ env.M6E_TAG }}-${{ github.run_id }}-${{ matrix.M6E_ARCH }}
          build-args: |-
            B19_COLOR=${{ inputs.B19_COLOR || vars.B19_COLOR || '1' }}
            B19_FETCH_DOCKER_CACHE=${{ inputs.B19_FETCH_DOCKER_CACHE || vars.B19_FETCH_DOCKER_CACHE || 'Y' }}
            B19_FETCH_LOCAL_CACHE=${{ inputs.B19_FETCH_LOCAL_CACHE || vars.B19_FETCH_LOCAL_CACHE || 'Y' }}
            B19_GO_BASE_IMAGE=${{ vars.B19_GO_BASE_IMAGE || format('{0}/b19/go:{1}', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho', env.M6E_TAG) }}
            B19_OFFGRID_MODE=${{ inputs.B19_OFFGRID_MODE || vars.B19_OFFGRID_MODE || 'N' }}
            B19_UBUNTU_BASE_IMAGE=${{ vars.B19_UBUNTU_BASE_IMAGE || format('{0}/b19/ubuntu/{1}:{2}', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho', vars.B19_UBUNTU_SERIES || 'resolute', env.M6E_TAG) }}
            B19_UBUNTU_SERIES=${{ inputs.B19_UBUNTU_SERIES || vars.B19_UBUNTU_SERIES || 'resolute' }}
            B19_VERBOSITY=${{ inputs.B19_VERBOSITY || vars.B19_VERBOSITY || 'info' }}
            DESTINATION_DOCKER_REGISTRY=${{ inputs.DESTINATION_DOCKER_REGISTRY || vars.DESTINATION_DOCKER_REGISTRY }}
            GOPROXY=${{ inputs.GOPROXY || vars.GOPROXY }}
            LANG=${{ inputs.LANG || vars.LANG }}
            M6E_APT_CACHE_HOST=${{ inputs.M6E_APT_CACHE_HOST || vars.M6E_APT_CACHE_HOST }}
            M6E_APT_CACHE_PORT=${{ inputs.M6E_APT_CACHE_PORT || vars.M6E_APT_CACHE_PORT }}
            M6E_ARCH=${{ matrix.M6E_ARCH }}
            M6E_BUILD_DEBUG=${{ inputs.M6E_BUILD_DEBUG || vars.M6E_BUILD_DEBUG }}
            M6E_NAMESPACE=projectfile
            M6E_NEAR_CACHE_HOST=${{ inputs.M6E_NEAR_CACHE_HOST || vars.M6E_NEAR_CACHE_HOST }}
            M6E_NEAR_CACHE_PORT=${{ inputs.M6E_NEAR_CACHE_PORT || vars.M6E_NEAR_CACHE_PORT }}
            M6E_PROJECT=ci
            SOURCE_DOCKER_REGISTRY=${{ inputs.SOURCE_DOCKER_REGISTRY || vars.SOURCE_DOCKER_REGISTRY }}
          mounts: fetch=/fetch
          pf-cli-image: ${{ vars.PF_CLI_IMAGE || format('{0}/projectfile/cli:{1}', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho', env.M6E_TAG) }}
          # This CELL's architecture, off the arch axis derived from the declared set.
          # One arch per call: the single-image archive is what every consumer reads.
          platform: ${{ matrix.M6E_ARCH }}
          mount-cache-key: ci-cache-mounts-${{ matrix.M6E_ARCH }}-
          mount-cache-restore-keys: ci-cache-mounts-
  image-is-ready:
    runs-on: ubuntu-latest
    needs: ["container-is-verified", "image-is-secure"]
    steps:
      - run: echo image-is-ready
  image-is-secure:
    runs-on: ubuntu-latest
    needs: ["image-is-built"]
    strategy:
      matrix:
        M6E_ARCH: ["amd64", "arm64", "riscv64"]
    env:
      M6E_ARCH: ${{ matrix.M6E_ARCH }}
      M6E_IMAGE_ARCHIVE: image-${{ matrix.M6E_ARCH }}-${{ github.run_id }}.tar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH)))
        with:
          name: image-${{ matrix.M6E_ARCH }}-${{ github.run_id }}
      - name: restore grype-db
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_SECURE != 'true' && vars.CI_SKIP_GRYPE_SCAN_TAR != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/grype-db
          key: ci-cache-grype-db-
          restore-keys: |
            ci-cache-grype-db-
      - name: grype-scan-tar
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_SECURE != 'true' && vars.CI_SKIP_GRYPE_SCAN_TAR != 'true'
        uses: projectfile-org/actions/run-tool@78f06c9316d295ea7b646ad1bdac87b76b7f999a # v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-grype image
          env: |-
            M6E_ARCH=${{ matrix.M6E_ARCH }}
            M6E_IMAGE_ARCHIVE=image-${{ matrix.M6E_ARCH }}-${{ github.run_id }}.tar
            M6E_SHARED_CACHE=N
          mounts: ${{ runner.temp }}/ci-cache/grype-db:/app/.cache/grype:rw
      - name: save grype-db
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_SECURE != 'true' && vars.CI_SKIP_GRYPE_SCAN_TAR != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/grype-db
          key: ci-cache-grype-db-${{ github.run_id }}
      - name: restore trivy-db
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_SECURE != 'true' && vars.CI_SKIP_TRIVY_SCAN_TAR != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/trivy-db
          key: ci-cache-trivy-db-
          restore-keys: |
            ci-cache-trivy-db-
      - name: trivy-scan-tar
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_SECURE != 'true' && vars.CI_SKIP_TRIVY_SCAN_TAR != 'true'
        uses: projectfile-org/actions/run-tool@78f06c9316d295ea7b646ad1bdac87b76b7f999a # v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-trivy image
          env: |-
            M6E_ARCH=${{ matrix.M6E_ARCH }}
            M6E_IMAGE_ARCHIVE=image-${{ matrix.M6E_ARCH }}-${{ github.run_id }}.tar
            M6E_SHARED_CACHE=N
            TRIVY_CACHE_BACKEND
          mounts: ${{ runner.temp }}/ci-cache/trivy-db:/app/.cache/trivy:rw
      - name: save trivy-db
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: (vars.CI_ONLY_M6E_ARCH == '' || contains(format(',{0},', vars.CI_ONLY_M6E_ARCH), format(',{0},', matrix.M6E_ARCH))) && vars.CI_SKIP_IMAGE_IS_SECURE != 'true' && vars.CI_SKIP_TRIVY_SCAN_TAR != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/trivy-db
          key: ci-cache-trivy-db-${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: reports-image-is-secure-${{ matrix.M6E_ARCH }}-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          overwrite: true
  image-is-signed:
    runs-on: ubuntu-latest
    needs: ["publish-image"]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - run: echo image-is-signed
  images-are-ok:
    runs-on: ubuntu-latest
    needs: ["image-is-built", "secrets-ready"]
    steps:
      - run: echo images-are-ok
  inputs-are-ok:
    runs-on: ubuntu-latest
    needs: ["documentation-is-ok", "projectfile-is-ok", "source-is-ok"]
    steps:
      - run: echo inputs-are-ok
  projectfile-is-ok:
    runs-on: ubuntu-latest
    needs: ["projectfile-is-valid"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: pf-bridge-check
        if: vars.CI_SKIP_PROJECTFILE_IS_OK != 'true' && vars.CI_SKIP_PF_BRIDGE_CHECK != 'true'
        uses: projectfile-org/actions/run-tool@78f06c9316d295ea7b646ad1bdac87b76b7f999a # v1
        with:
          image: ${{ vars.PF_BRIDGE_IMAGE || format('{0}/projectfile/bridge', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: pf-bridge check
  projectfile-is-valid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: pf-validate
        if: vars.CI_SKIP_PROJECTFILE_IS_VALID != 'true' && vars.CI_SKIP_PF_VALIDATE != 'true'
        uses: projectfile-org/actions/run-tool@78f06c9316d295ea7b646ad1bdac87b76b7f999a # v1
        with:
          image: ${{ vars.PF_CLI_IMAGE || format('{0}/projectfile/cli', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: pf-cli validate
  publish-image:
    runs-on: ubuntu-latest
    needs: ["image-is-built", "ready-to-publish", "signing-is-ready"]
    if: (startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (startsWith(github.ref, 'refs/tags/'))
    steps:
      - run: echo publish-image
  published:
    runs-on: ubuntu-latest
    needs: ["binaries-are-released", "image-is-attested", "publish-image", "ready-to-publish"]
    steps:
      - run: echo published
  ready-to-publish:
    runs-on: ubuntu-latest
    needs: ["artifacts-are-ok"]
    steps:
      - run: echo ready-to-publish
  secrets-ready:
    runs-on: ubuntu-latest
    needs: ["image-is-built"]
    steps:
      - run: echo secrets-ready
  signing-is-ready:
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (startsWith(github.ref, 'refs/tags/'))
    env:
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: cosign-key-file-preflight
        if: vars.CI_SKIP_SIGNING_IS_READY != 'true' && vars.CI_SKIP_COSIGN_KEY_FILE_PREFLIGHT != 'true'
        run: .makefile/b19/scripts/cosign-key-file.sh
      - name: cosign-preflight
        if: vars.CI_SKIP_SIGNING_IS_READY != 'true' && vars.CI_SKIP_COSIGN_PREFLIGHT != 'true'
        uses: projectfile-org/actions/run-tool@78f06c9316d295ea7b646ad1bdac87b76b7f999a # v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-cosign preflight
          env: |-
            COSIGN_PASSWORD=${{ secrets.COSIGN_PASSWORD }}
  source-is-compliant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: i18n-check
        if: vars.CI_SKIP_SOURCE_IS_COMPLIANT != 'true' && vars.CI_SKIP_I18N_CHECK != 'true'
