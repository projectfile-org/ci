---
name: check-outdated
"on":
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
permissions:
  contents: read
env:
  M6E_TAG: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
  M6E_RUN_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
  GOPROXY: https://kiota.ch/api/packages/projectfile/go,direct
jobs:
  check-outdated:
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch') || (github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: restore go
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: vars.CI_SKIP_CHECK_OUTDATED != 'true' && vars.CI_SKIP_CHECK_OUTDATED_GO != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/go
          key: ci-cache-go-
          restore-keys: |
            ci-cache-go-
      - name: check-outdated-go
        if: vars.CI_SKIP_CHECK_OUTDATED != 'true' && vars.CI_SKIP_CHECK_OUTDATED_GO != 'true'
        uses: projectfile-org/actions/run-tool@0a61a9791cfabc5fdbc085e036a9ce9dc03619ab # v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: go-outdated
          env: |-
            GOPROXY
          mounts: ${{ runner.temp }}/ci-cache/go:/app/.cache/go:rw
      - name: save go
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: vars.CI_SKIP_CHECK_OUTDATED != 'true' && vars.CI_SKIP_CHECK_OUTDATED_GO != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/go
          key: ci-cache-go-${{ github.run_id }}
