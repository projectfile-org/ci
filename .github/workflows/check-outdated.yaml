---
name: check-outdated
"on":
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
permissions:
  contents: read
env:
  M6E_TAG: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
  M6E_RUN_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
  GOPROXY: https://kiota.ch/api/packages/projectfile/go,direct
jobs:
  check-outdated:
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch') || (github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: restore go
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ci-cache/go
          key: ci-cache-go-
          restore-keys: |
            ci-cache-go-
      - name: check-outdated-go
        uses: projectfile-org/actions/run-tool@a70dd49da9c1c8cd7eb6466da17d4b1640e4116f # v1
        with:
          image: ${{ vars.GO_TOOL_IMAGE || format('{0}/b19/go', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: go list -u -m all
          env: |-
            GOPROXY
          mounts: ${{ runner.temp }}/ci-cache/go:/app/.cache/go:rw
      - name: save go
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ci-cache/go
          key: ci-cache-go-${{ github.run_id }}
